apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "posts-api.labels" . | nindent 4 }}
  annotations:
    # Needed before the migrate Job's pre-install/pre-upgrade hook runs, which
    # otherwise fires before this normal resource would be created.
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
automountServiceAccountToken: false
