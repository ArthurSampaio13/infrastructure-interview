apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}-test
  labels: {{- include "posts-api.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
spec:
  restartPolicy: Never
  containers:
    - name: check
      image: curlimages/curl:8.11.1
      command: ["curl", "-fsS", "http://{{ .Release.Name }}:{{ .Values.env.port }}/posts"]
