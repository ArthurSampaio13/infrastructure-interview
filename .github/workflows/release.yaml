name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: release-${{ github.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - run: |
          chart=$(yq .version charts/posts-api/Chart.yaml)
          if [ "$chart" != "$VERSION" ]; then
            echo "Chart.yaml version $chart != tag $VERSION" >&2
            exit 1
          fi
        env:
          VERSION: ${{ steps.version.outputs.version }}
      # Scan a local single-arch build first; nothing reaches the registry if it fails.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app
          platforms: linux/amd64
          load: true
          tags: posts-api:scan
          cache-to: type=gha,mode=max
      - run: trivy image --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 posts-api:scan
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha
          tags: |
            skizay/posts-api:${{ steps.version.outputs.version }}
            skizay/posts-api:latest
            skizay/posts-api-private:${{ steps.version.outputs.version }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - run: |
          cosign sign --yes "skizay/posts-api@$DIGEST"
          cosign sign --yes "skizay/posts-api-private@$DIGEST"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - run: |
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          helm package charts/posts-api --app-version "${{ steps.version.outputs.version }}"
          helm push posts-api-*.tgz oci://ghcr.io/arthursampaio13/charts
        env:
          GH_TOKEN: ${{ github.token }}
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
