name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: release-${{ github.ref }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - run: |
          chart=$(yq .version charts/posts-api/Chart.yaml)
          if [ "$chart" != "$VERSION" ]; then
            echo "Chart.yaml version $chart != tag $VERSION" >&2
            exit 1
          fi
        env:
          VERSION: ${{ steps.version.outputs.version }}
      # Scan a local single-arch build first; nothing reaches the registry if it fails.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: app
          platforms: linux/amd64
          load: true
          tags: posts-api:scan
          cache-to: type=gha,mode=max
      - run: trivy image --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 posts-api:scan
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: app
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha
          tags: |
            skizay/posts-api:${{ steps.version.outputs.version }}
            skizay/posts-api:latest
            skizay/posts-api-private:${{ steps.version.outputs.version }}
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - run: |
          cosign sign --yes "skizay/posts-api@$DIGEST"
          cosign sign --yes "skizay/posts-api-private@$DIGEST"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - run: |
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          helm package charts/posts-api --app-version "${{ steps.version.outputs.version }}"
          helm push posts-api-*.tgz oci://ghcr.io/arthursampaio13/charts
        env:
          GH_TOKEN: ${{ github.token }}
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
