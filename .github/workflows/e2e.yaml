name: e2e
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KUBECONFIG: /home/runner/.kube/kind-interview.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
      - run: make infra
      - run: make build kind-load deploy
      - run: echo "127.0.0.1 posts.local.test grafana.local.test" | sudo tee -a /etc/hosts
      - run: make test
      - run: helm test posts-api -n posts-api
      - if: failure()
        run: |
          mkdir -p /tmp/diag
          kubectl get pods -A -o wide > /tmp/diag/pods.txt || true
          kubectl get events -A --sort-by=.lastTimestamp > /tmp/diag/events.txt || true
          kubectl -n mysql get innodbcluster -o yaml > /tmp/diag/innodbcluster.yaml || true
          kubectl -n mysql-operator logs deploy/mysql-operator --tail=-1 > /tmp/diag/mysql-operator.log || true
          for p in mysql-0 mysql-1 mysql-2; do
            kubectl -n mysql logs "$p" --all-containers --tail=-1 > "/tmp/diag/$p.log" || true
          done
          kubectl logs -n posts-api -l app.kubernetes.io/name=posts-api --tail=-1 > /tmp/diag/app.log || true
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: diagnostics
          path: /tmp/diag
