nginx:
  replicas: 2
  service:
    type: NodePort
    externalTrafficPolicy: Cluster
    nodePorts:
      - port: 30080
        listenerPort: 80
      - port: 30443
        listenerPort: 443
  pod:
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: gateway-nginx
